name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns on Pages (source: GitHub Actions) on the first run,
      # so the site deploys without anyone flipping a switch in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain HTML/CSS/JS — no build step. Stage only the files
      # that belong on the web so .git and CI config are never published.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html styles.css main.js .nojekyll _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
